<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LIU QI ANIMATION</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#38bdf8);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}


.container{
    width:90%;
    max-width:1200px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 20px 40px rgba(0,0,0,.35);
    text-align:center;
}


/* Tajuk utama */

h1{
    color:white;
    font-size:48px;
    letter-spacing:4px;
    margin-bottom:10px;
}


/* Description */

p{
    color:#dbeafe;
    margin-bottom:25px;
    font-size:18px;
}


/* Button */
.btn{
    display:inline-block;
    margin-bottom:25px;
    padding:14px 35px;
    background:linear-gradient(45deg,#2563eb,#38bdf8);
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
    border-radius:12px;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}


.btn:hover{
    transform:translateY(-4px) scale(1.05);
    box-shadow:0 15px 30px rgba(0,0,0,.35);

}


/* iframe */

iframe{
    width:100%;
    height:600px;
    border:none;
    border-radius:15px;
    background:white;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}
/* Title Video LiuQI */

h2{
    color:white;
    margin:30px 0 15px;
    font-size:28px;
    text-shadow:
    0 0 10px #38bdf8,
    0 0 20px #38bdf8;
}
/* Video */
video{
    width:100%;
    border-radius:15px;
    background:black;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}
/* Untuk Telefon :D */

@media(max-width:768px){
    h1{
        font-size:34px;
    }
    p{
        font-size:16px;
    }
    iframe{
        height:450px;
    }
    .btn{
        width:100%;
    }
    h2{
        font-size:22px;
    }
}
</style>
</head>
<body>
<div class="container">
    <h1>LIU QI ANIMATION</h1>
    <p>Interactive Animation Viewer</p>
    <h2>
        Coded By Nas hensem
    </h2>
    <a href="https://canva.link/xziekg3n9stxg55"
       target="_blank"
       class="btn">
       Back To Main Website
    </a>
    <iframe src="home.html"></iframe>
    <h2>
        By Adha Paling Hensem
    </h2>
    <video controls>
        <source src="adha.mp4" type="video/mp4">
    </video>
</div>
</body>
</html>
