<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIU QI ANIMATION</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#38bdf8);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            width:90%;
            max-width:1200px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(12px);
            border-radius:20px;
            padding:30px;
            box-shadow:0 20px 40px rgba(0,0,0,.35);
            text-align:center;
        }

        h1{
            color:white;
            font-size:48px;
            letter-spacing:4px;
            margin-bottom:10px;
        }

        p{
            color:#dbeafe;
            margin-bottom:25px;
        }

        iframe{
            width:100%;
            height:600px;
            border:none;
            border-radius:15px;
            background:white;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>LIU QI ANIMATION</h1>
    <p>Interactive Animation Viewer</p>
    <br>
    <p>Coded By nas hensem</p>

    <iframe src="home.html"></iframe>

</div>

</body>
</html>
